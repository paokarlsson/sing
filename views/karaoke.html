<div class="karaoke">
  <p class="eyebrow">Karaoke</p>
  <h1 class="display" id="ktitle"></h1>

  <audio id="kaudio" preload="metadata"></audio>

  <div class="kplayer" id="kplayer">
    <div class="kstage" id="kstage" aria-live="off">
      <div class="kroll" id="kroll"></div>
      <p class="kcount" id="kcount" hidden></p>
    </div>

    <div class="ktransport">
      <button class="kplay" id="kplay" aria-label="Spela"></button>
      <input type="range" id="kseek" min="0" max="1000" value="0" aria-label="Position i låten">
      <div class="kclock"><span id="know">0:00</span> / <span id="ktot">0:00</span></div>
      <button class="kfs" id="kfs" aria-label="Helskärm" aria-pressed="false"></button>
    </div>
  </div>

  <div class="kopts">
    <span>Volym</span>
    <input type="range" id="kvol" min="0" max="100" value="100" aria-label="Volym">
  </div>

  <h2 class="eyebrow klisthead">Hela texten · klicka på en rad för att hoppa dit</h2>
  <ol class="klist" id="klist"></ol>

  <p class="ksrc small muted">Texten är maskintranskriberad (Whisper) och kan innehålla felhörningar.</p>
</div>
