<meta name="theme-color" content="#F4EDE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1611" media="(prefers-color-scheme: dark)">

<script>
/* Sätter temat innan sidan målas så att den inte blinkar.
   js/theme.js äger valet i övrigt och använder samma nyckel. */
(function(){
  var saved = null;
  try { saved = localStorage.getItem('sing-theme'); } catch (e) {}
  var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.setAttribute('data-theme', saved || (light ? 'light' : 'dark'));
})();
</script>
