<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psalmspelaren</title>
<style>
  :root{
    --night:#0E1426; --glass:#24304F; --candle:#E9B15C; --vine:#4F8E92;
    --parchment:#EFE8D8; --dim:#808CAE;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  :root[data-theme="light"]{
    --night:#EDE9DC; --glass:#CFC7B0; --candle:#A9701F; --vine:#3A6E73;
    --parchment:#1A2138; --dim:#6C7188;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--night);color:var(--parchment);font-family:var(--sans);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
  .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}

  .picker{margin-bottom:20px}
  .picker label{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
                display:block;margin-bottom:7px}
  .selwrap{position:relative}
  .selwrap select{width:100%;-webkit-appearance:none;appearance:none;background:none;
                  border:1px solid var(--glass);border-radius:2px;color:var(--parchment);
                  font-family:var(--serif);font-size:17px;padding:12px 40px 12px 14px;
                  cursor:pointer;transition:border-color .15s}
  .selwrap select:hover{border-color:var(--candle)}
  .selwrap select:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
  .selwrap select option{background:#131A2E;color:#EFE8D8;font-size:15px}
  .loadrow{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .fbtn{font-family:var(--sans);font-size:11px;letter-spacing:.08em;padding:8px 13px;
        border:1px solid var(--glass);border-radius:2px;color:var(--dim);cursor:pointer;
        transition:border-color .15s,color .15s}
  .fbtn:hover{border-color:var(--candle);color:var(--candle)}
  #loadmsg{font-size:11px;letter-spacing:.06em;color:var(--dim)}
  #loadmsg.err{color:#D2717F}
  .selwrap::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;
                  border-right:1px solid var(--candle);border-bottom:1px solid var(--candle);
                  transform:translateY(-70%) rotate(45deg);pointer-events:none}

  h1{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05;margin:0}
  .credit{font-size:11px;letter-spacing:.1em;color:var(--dim);margin:8px 0 16px}
  .credit b{color:var(--parchment);font-weight:500}

  .stage{position:relative;border:1px solid var(--glass);border-radius:3px;overflow:hidden;
         background:linear-gradient(180deg,#0B1020 0%,#182142 100%)}
  :root[data-theme="light"] .stage{background:linear-gradient(180deg,#FCFAF2 0%,#E4DECB 100%)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  #theme{width:38px;height:38px;border-radius:50%;flex:0 0 auto;font-size:14px;line-height:1;
         display:grid;place-items:center;color:var(--dim);margin-top:-4px}
  #theme:hover{border-color:var(--candle);color:var(--candle)}
  :root[data-theme="light"] .selwrap select option{background:#FFFFFF;color:#1A2138}
  canvas{display:block;width:100%;height:56vh;min-height:380px;max-height:540px}

  .lyric{margin:18px 0 4px;min-height:112px}
  .vlabel{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--candle);
          margin-bottom:7px;min-height:13px}
  .line{font-family:var(--serif);font-size:23px;line-height:1.35}
  .line.next{font-size:17px;color:var(--dim);margin-top:8px}
  .syl{color:var(--dim);transition:color .12s linear}
  .syl.sung{color:var(--parchment)}
  .syl.now{color:var(--candle)}

  .transport{display:flex;align-items:center;gap:14px;margin-top:20px;
             border-top:1px solid var(--glass);padding-top:18px}
  button{font-family:var(--sans);cursor:pointer;background:none;color:inherit;border:1px solid var(--glass);
         border-radius:2px;transition:border-color .15s,color .15s,background .15s}
  button:hover:not(:disabled){border-color:var(--candle);color:var(--candle)}
  button:focus-visible{outline:2px solid var(--candle);outline-offset:2px}
  button:disabled{opacity:.35;cursor:default}
  #play{width:52px;height:52px;border-radius:50%;border-color:var(--candle);color:var(--candle);
        font-size:17px;flex:0 0 auto;display:grid;place-items:center}
  .bar{flex:1}
  input[type=range]{width:100%;-webkit-appearance:none;background:none;height:22px}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--glass)}
  input[type=range]::-moz-range-track{height:2px;background:var(--glass)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
        background:var(--candle);margin-top:-5px}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--candle)}
  .clock{font-size:11px;letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums;flex:0 0 auto}

  .controls{display:grid;gap:12px;margin-top:16px;grid-template-columns:1fr;
            border-top:1px solid var(--glass);padding-top:16px}
  @media(min-width:560px){.controls{grid-template-columns:auto auto;justify-content:space-between}}
  .row{display:flex;gap:8px;align-items:center}
  .row>span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
            margin-right:4px;flex:0 0 auto}
  .row button{font-size:12px;padding:7px 11px;color:var(--dim);min-width:36px}
  .row button.on{border-color:var(--candle);color:var(--candle)}
  #keyname{font-family:var(--serif);font-size:16px;color:var(--parchment);min-width:118px;
           text-align:center}
  #keyname em{font-style:normal;font-family:var(--sans);font-size:10px;letter-spacing:.14em;
              color:var(--dim);display:block;margin-top:2px}

  .voice{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:16px;
         border-top:1px solid var(--glass);padding-top:16px}
  .voice button{font-size:12px;padding:9px 14px;letter-spacing:.06em;color:var(--dim)}
  .voice button.on,.voice button.on:hover{border-color:#E38FA8;color:#E38FA8}
  .voice button#midi.on,.voice button#midi.on:hover{border-color:#8F86D8;color:#8F86D8}
  .tuner{font-family:var(--serif);font-size:15px;color:var(--dim);display:flex;gap:11px;
         align-items:baseline}
  .tuner b{font-size:21px;color:var(--parchment);font-weight:400;min-width:56px;display:inline-block}
  .tuner em{font-style:normal;font-family:var(--sans);font-size:10px;letter-spacing:.16em;
            text-transform:uppercase;color:var(--dim)}
  .tuner.good b,.tuner.good em{color:#7FC98A}
  .tuner.near b,.tuner.near em{color:var(--candle)}
  .legend{display:flex;gap:18px;margin-top:18px;font-size:10px;letter-spacing:.16em;
          text-transform:uppercase;color:var(--dim)}
  .legend i{display:inline-block;width:16px;height:3px;margin-right:7px;vertical-align:middle;border-radius:1px}

  .verses{margin-top:34px;border-top:1px solid var(--glass);padding-top:20px;
          display:grid;gap:22px;grid-template-columns:1fr}
  @media(min-width:620px){.verses{grid-template-columns:1fr 1fr}}
  .verses h2{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
             font-weight:500;margin:0 0 8px}
  .verses p{font-family:var(--serif);font-size:15px;line-height:1.6;color:#B9C0D4;margin:0}
  .src{margin-top:26px;font-size:10px;letter-spacing:.12em;color:#5C6684}
  @media(prefers-reduced-motion:reduce){.syl{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <p class="eyebrow">Den svenska psalmboken · fria melodier</p>
    <button id="theme" aria-label="Byt mellan mörkt och ljust läge">☾</button>
  </div>
  <div class="picker">
    <label for="song">Välj psalm</label>
    <div class="selwrap"><select id="song"></select></div>
    <div class="loadrow">
      <label class="fbtn" for="midifile">Ladda egen MIDI…</label>
      <input type="file" id="midifile" accept=".mid,.midi,.kar" hidden>
      <span id="loadmsg"></span>
    </div>
  </div>

  <h1 id="title"></h1>
  <p class="credit" id="credit"></p>

  <div class="stage"><canvas id="c"></canvas></div>

  <div class="lyric">
    <div class="vlabel" id="vlabel"></div>
    <div class="line" id="l0"></div>
    <div class="line next" id="l1"></div>
  </div>

  <div class="transport">
    <button id="play" aria-label="Spela">▶</button>
    <div class="bar"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position i psalmen"></div>
    <div class="clock"><span id="now">0:00</span> / <span id="tot">0:00</span></div>
  </div>

  <div class="controls">
    <div class="row">
      <span>Tonart</span>
      <button id="down" aria-label="Sänk en halvton">−</button>
      <div id="keyname"></div>
      <button id="up" aria-label="Höj en halvton">+</button>
    </div>
    <div class="row">
      <span>Tempo</span>
      <button data-r="0.7">0,7×</button>
      <button data-r="0.85">0,85×</button>
      <button data-r="1" class="on">1×</button>
    </div>
  </div>

  <div class="voice">
    <button id="mic" aria-pressed="false">Mikrofon av</button>
    <button id="midi" aria-pressed="false">MIDI av</button>
    <div class="tuner" id="tuner"><b id="tnote">–</b><em id="tcents">sjung med</em></div>
  </div>

  <div class="legend">
    <div><i style="background:#E9B15C"></i>Melodi</div>
    <div><i style="background:#4F8E92"></i>Alt, tenor, bas</div>
    <div><i style="background:#E38FA8"></i>Din röst</div>
    <div><i style="background:#8F86D8"></i>Ditt spel</div>
  </div>

  <div class="verses" id="verses"></div>
  <p class="src" id="src"></p>
</div>

const SMIDI = [36,48,60,72,84];
const LOOK = 2.6;
const KEYS = ["C","Dess","D","Ess","E","F","Gess","G","Ass","A","B","H"];
let D = SONGS[0];

/* ---------- orgelsampler ---------- */
let AC=null, master=null, buffers={}, offsets={};
function b64buf(s){ const b=atob(s), u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; }
function makeIR(sec){
  const n=Math.floor(AC.sampleRate*sec), buf=AC.createBuffer(2,n,AC.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6); }
  return buf;
}
async function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
  const conv = AC.createConvolver(); conv.buffer = makeIR(2.4);
  const wet = AC.createGain(); wet.gain.value=0.32; conv.connect(wet); wet.connect(AC.destination);
  master.connect(conv);
  await Promise.all(SMIDI.map(async m=>{
    buffers[m] = await AC.decodeAudioData(b64buf(SAMPLES[m]));
    const d = buffers[m].getChannelData(0); let i=0;
    while(i<d.length && Math.abs(d[i])<0.004) i++;
    offsets[m] = i/buffers[m].sampleRate;
  }));
}
function nearest(m){ let best=SMIDI[0];
  for(const s of SMIDI) if(Math.abs(s-m)<Math.abs(best-m)) best=s; return best; }
let voices=[];
function voice(midi, when, dur, hand){
  const s=nearest(midi), src=AC.createBufferSource(), g=AC.createGain();
  src.buffer=buffers[s]; src.playbackRate.value=Math.pow(2,(midi-s)/12);
  const lvl = hand?0.20:0.30;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(lvl, when+0.035);
  g.gain.setValueAtTime(lvl, when+Math.max(dur,0.1));
  g.gain.linearRampToValueAtTime(0.0001, when+Math.max(dur,0.1)+0.14);
  src.connect(g); g.connect(master);
  src.start(when, offsets[s]); src.stop(when+Math.max(dur,0.1)+0.18);
  voices.push(src); src.onended=()=>{ voices=voices.filter(v=>v!==src); };
}
function allOff(){ voices.forEach(v=>{ try{v.stop();}catch(e){} }); voices=[]; }

/* ---------- transport ---------- */
let playing=false, t0=0, paused=-LOOK, rate=1, shift=0, nextIdx=0, timer=null, frozen=0;
function pieceTime(){ return playing ? (AC.currentTime-t0)*rate : paused; }
function locate(pt){ nextIdx=0; while(nextIdx<D.notes.length && D.notes[nextIdx].t<pt) nextIdx++; }
function schedule(){
  const horizon = AC.currentTime+0.25;
  while(nextIdx<D.notes.length){
    const n=D.notes[nextIdx], when=t0+n.t/rate;
    if(when>horizon) break;
    voice(n.m+shift, Math.max(when,AC.currentTime), n.d/rate, n.h);
    nextIdx++;
  }
  if(pieceTime() >= D.end){          // runt igen från vers 1
    t0 += D.end/rate; locate(0); shown=-2; hist.length=0;
  }
}
async function start(){
  await initAudio();
  if(AC.state==='suspended') await AC.resume();
  if(paused>=D.end) paused=-LOOK;
  t0 = AC.currentTime+0.08-paused/rate;
  locate(paused); playing=true; setBtn(true);
  timer=setInterval(schedule,25); schedule();
}
function stop(reset){
  playing=false; clearInterval(timer); timer=null; allOff(); setBtn(false);
  paused = reset ? -LOOK : Math.min(frozen, D.end);
  if(reset) shown=-2;
}
function setBtn(on){ const b=document.getElementById('play');
  b.textContent = on?'❙❙':'▶'; b.setAttribute('aria-label', on?'Pausa':'Spela'); }
function toggle(){ if(playing){ frozen=pieceTime(); stop(false); } else start(); }
function seekTo(pt){ const was=playing;
  if(playing){ frozen=pieceTime(); stop(false); }
  paused=pt; shown=-2; hist.length=0; if(was) start(); }

/* ---------- grafik ---------- */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const WHITE=new Set([0,2,4,5,7,9,11]);
let whites=[], wIndex=new Map(), lo=0, hi=0;
function buildRange(){
  lo=Math.min(...D.notes.map(n=>n.m))+shift; hi=Math.max(...D.notes.map(n=>n.m))+shift;
  while(!WHITE.has(((lo%12)+12)%12)) lo--;
  while(!WHITE.has(((hi%12)+12)%12)) hi++;
  whites=[]; for(let m=lo;m<=hi;m++) if(WHITE.has(m%12)) whites.push(m);
  wIndex=new Map(whites.map((m,i)=>[m,i]));
  resize();
}
let W=0,H=0,KEYW=0,WH=0,BH=0,HIT=0;
function resize(){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  W=r.width; H=r.height;
  KEYW=Math.round(Math.max(50,Math.min(86,W*0.17)));
  HIT=KEYW+Math.round(Math.min(96,W*0.19));
  WH=H/whites.length; BH=WH*0.62;
}
new ResizeObserver(resize).observe(cv);
function keyY(m){
  if(WHITE.has(m%12)){ const i=wIndex.get(m); return [H-(i+1)*WH, H-i*WH]; }
  const cy=H-(wIndex.get(m-1)+1)*WH; return [cy-BH/2, cy+BH/2];
}
function rr(x,y,w,h,r){
  r=Math.min(r,w/2,Math.abs(h)/2); ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function draw(t){
  ctx.clearRect(0,0,W,H);
  const pps=(W-HIT)/LOOK;
  ctx.strokeStyle=P.grid; ctx.lineWidth=1;
  for(const m of whites) if(m%12===0){ const [,y1]=keyY(m);
    ctx.beginPath(); ctx.moveTo(KEYW,Math.round(y1)+.5); ctx.lineTo(W,Math.round(y1)+.5); ctx.stroke(); }
  const active=new Set();
  for(const n of D.notes){
    const x0=HIT+(n.t-t)*pps, x1=x0+n.d*pps;
    if(x1<KEYW||x0>W) continue;
    const m=n.m+shift;
    if(t>=n.t && t<n.t+n.d) active.add(m);
    const [y0,y1]=keyY(m), h=y1-y0, pad=h*0.11;
    const bx0=Math.max(x0,KEYW), bx1=Math.min(x1,W);
    ctx.fillStyle = n.h?P.acc:P.mel;
    rr(bx0,y0+pad,bx1-bx0,h-2*pad,3); ctx.fill();
    ctx.strokeStyle = n.h?P.accEdge:P.melEdge; ctx.stroke();
    if(n.s>=0){
      const s=D.syl[n.s].x.trim();
      if(s){
        ctx.font='600 12px "Palatino Linotype",Palatino,Georgia,serif'; ctx.textBaseline='middle';
        if(bx1-bx0 > ctx.measureText(s).width+9){
          ctx.fillStyle=P.syl; ctx.fillText(s,bx0+5,(y0+y1)/2+1);
        }
      }
    }
  }
  ctx.textBaseline='alphabetic';
  for(const m of whites){
    const [y0,y1]=keyY(m), on=active.has(m);
    ctx.fillStyle = held.has(m)?P.midi:(on?P.whiteOn:P.white);
    ctx.fillRect(0,y0,KEYW,y1-y0-1);
    ctx.strokeStyle=P.border; ctx.lineWidth=1;
    ctx.strokeRect(.5,Math.round(y0)+.5,KEYW-1,Math.round(y1-y0-1));
    if(m%12===0 && WH>11){
      ctx.font='9px ui-sans-serif,system-ui,sans-serif'; ctx.fillStyle=P.label; ctx.textAlign='right';
      ctx.fillText('C'+(Math.floor(m/12)-1),KEYW-4,y1-4); ctx.textAlign='left';
    }
  }
  for(let m=lo;m<=hi;m++){
    if(WHITE.has(m%12)) continue;
    const [y0,y1]=keyY(m), on=active.has(m);
    ctx.fillStyle = held.has(m)?P.midi:(on?P.blackOn:P.black);
    ctx.fillRect(0,y0,KEYW*0.62,y1-y0);
  }
  ctx.fillStyle=P.hit; ctx.fillRect(HIT-1,0,2,H);
  drawPlayed(t,pps);
  drawVoice(t,pps);
}

/* ---------- mikrofon: YIN-tonhojdsdetektering ---------- */
const BUF_SIZE=2048, YIN_THRESH=0.12, RMS_GATE=0.008;
const NOTE_SV=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let micStream=null, analyser=null, mbuf=null, micOn=false;
const hist=[];

function detectPitch(buffer, sampleRate){
  const SIZE=buffer.length;
  let rms=0; for(let i=0;i<SIZE;i++) rms+=buffer[i]*buffer[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<RMS_GATE) return -1;
  const minTau=Math.max(2,Math.floor(sampleRate/1200));
  const tauMax=Math.min(Math.floor(SIZE/2),Math.floor(sampleRate/65));
  if(tauMax<=minTau) return -1;
  const d=new Float32Array(tauMax+1);
  for(let tau=1;tau<=tauMax;tau++){
    let sum=0;
    for(let j=0;j+tau<SIZE;j++){ const df=buffer[j]-buffer[j+tau]; sum+=df*df; }
    d[tau]=sum;
  }
  const cmnd=new Float32Array(tauMax+1); cmnd[0]=1;
  let run=0;
  for(let tau=1;tau<=tauMax;tau++){ run+=d[tau]; cmnd[tau]= run===0?1:(d[tau]*tau)/run; }
  let tauEst=-1;
  for(let tau=minTau;tau<=tauMax;tau++){
    if(cmnd[tau]<YIN_THRESH){ let t2=tau;
      while(t2+1<=tauMax && cmnd[t2+1]<cmnd[t2]) t2++;
      tauEst=t2; break; }
  }
  if(tauEst===-1){
    let mn=Infinity,pos=-1;
    for(let tau=minTau;tau<=tauMax;tau++) if(cmnd[tau]<mn){ mn=cmnd[tau]; pos=tau; }
    if(mn>0.4) return -1;
    tauEst=pos;
  }
  let refined=tauEst;
  if(tauEst>1 && tauEst+1<=tauMax){
    const s0=cmnd[tauEst-1],s1=cmnd[tauEst],s2=cmnd[tauEst+1];
    const den=2*(2*s1-s2-s0);
    if(den!==0) refined=tauEst+(s2-s0)/den;
  }
  const f=sampleRate/refined;
  if(!isFinite(f)||f<60||f>1300) return -1;
  return f;
}

function posOfInt(m){                       // vertikal position i vita tangenter
  if(WHITE.has(((m%12)+12)%12)){ const i=wIndex.get(m); return i===undefined?null:i+0.5; }
  const i=wIndex.get(m-1); return i===undefined?null:i+1;
}
function yForPitch(m){
  const lo2=Math.floor(m), fr=m-lo2;
  const a=posOfInt(lo2), b=posOfInt(lo2+1);
  if(a===null||b===null) return null;
  return H-(a+(b-a)*fr)*WH;
}
function fold(m){                           // vik in i klaviaturens omfång
  while(m<lo-0.5) m+=12;
  while(m>hi+0.5) m-=12;
  return m;
}
function targetAt(t){
  for(const n of D.notes) if(n.h===0 && t>=n.t && t<n.t+n.d) return n.m+shift;
  return null;
}

function drawVoice(t,pps){
  if(!micOn) return;
  ctx.lineWidth=2.5; ctx.strokeStyle=P.voice; ctx.lineJoin='round';
  ctx.beginPath();
  let started=false, lastY=null;
  for(const h of hist){
    const x=HIT+(h.t-t)*pps;
    if(x<KEYW||x>W) { started=false; continue; }
    const y=yForPitch(fold(h.m));
    if(y===null){ started=false; continue; }
    if(started) ctx.lineTo(x,y); else { ctx.moveTo(x,y); started=true; }
    lastY=y;
  }
  if(started) ctx.stroke();
  if(lastY!==null){
    ctx.beginPath(); ctx.arc(HIT,lastY,4.5,0,6.284);
    ctx.fillStyle=P.voice; ctx.fill();
    ctx.strokeStyle=P.voiceRing; ctx.lineWidth=1.5; ctx.stroke();
  }
}

const tunerEl=document.getElementById('tuner'), tNote=document.getElementById('tnote'),
      tCents=document.getElementById('tcents');
function readVoice(t){
  if(!micOn||!analyser) return;
  analyser.getFloatTimeDomainData(mbuf);
  const f=detectPitch(mbuf,AC.sampleRate);
  if(f<0){
    if(hist.length && t-hist[hist.length-1].t>0.25){ tNote.textContent='–'; tCents.textContent='tyst';
      tunerEl.className='tuner'; }
    return;
  }
  const m=69+12*Math.log2(f/440);
  hist.push({t:t,m:m});
  while(hist.length>400) hist.shift();
  const heldKeys=[...held.keys()];
  const target = heldKeys.length ? heldKeys[heldKeys.length-1] : targetAt(t);
  const mot = heldKeys.length ? 'mot tangent' : 'mot noten';
  const name=NOTE_SV[((Math.round(m)%12)+12)%12]+(Math.floor(Math.round(m)/12)-1);
  if(target===null){
    tNote.textContent=name; tCents.textContent=Math.round(f)+' Hz'; tunerEl.className='tuner';
    return;
  }
  const diff=m-target, oct=Math.round(diff/12), cents=Math.round((diff-12*oct)*100);
  const ab=Math.abs(cents);
  tunerEl.className='tuner'+(ab<=25?' good':ab<=50?' near':'');
  tNote.textContent=name;
  tCents.textContent=(ab<=12?'rent':(cents>0?'+':'')+cents+' cent')
    +(oct?'  ·  '+(oct>0?'+':'')+oct+' okt':'')+'  ·  '+mot;
}

/* ---------- MIDI-klaviatur ---------- */
let midiOn=false, midiAccess=null;
const held=new Map();          // midinot -> {t0, src}
const played=[];               // {m, t0, t1}

function liveNote(midi){
  const sm=nearest(midi), src=AC.createBufferSource(), g=AC.createGain();
  src.buffer=buffers[sm]; src.playbackRate.value=Math.pow(2,(midi-sm)/12);
  const now=AC.currentTime;
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(0.30, now+0.03);
  src.connect(g); g.connect(master);
  src.start(now, offsets[sm]);
  return { stop(){ const t=AC.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(Math.max(g.gain.value,0.0001), t);
      g.gain.linearRampToValueAtTime(0.0001, t+0.18);
      try{ src.stop(t+0.22); }catch(e){} } };
}
function keyDown(m){
  if(held.has(m)) return;
  const rec={t0:pieceTime(), src:liveNote(m)};
  held.set(m, rec);
  played.push({m:m, t0:rec.t0, t1:null});
  while(played.length>60) played.shift();
}
function keyUp(m){
  const rec=held.get(m); if(!rec) return;
  rec.src.stop(); held.delete(m);
  for(let i=played.length-1;i>=0;i--)
    if(played[i].m===m && played[i].t1===null){ played[i].t1=pieceTime(); break; }
}
function onMIDI(e){
  const [st,d1,d2]=e.data, cmd=st&0xF0;
  if(cmd===0x90 && d2>0) keyDown(d1);
  else if(cmd===0x80 || (cmd===0x90 && d2===0)) keyUp(d1);
  else if(cmd===0xB0 && d1===123) { [...held.keys()].forEach(keyUp); }
}
function attachMIDI(){
  let n=0, names=[];
  midiAccess.inputs.forEach(inp=>{ inp.onmidimessage=onMIDI; n++; names.push(inp.name); });
  const b=document.getElementById('midi');
  b.textContent = n ? 'MIDI: '+names[0].slice(0,18) : 'MIDI på (ingen enhet)';
  return n;
}
async function midiToggle(){
  const b=document.getElementById('midi');
  if(midiOn){
    midiOn=false; [...held.keys()].forEach(keyUp); played.length=0;
    if(midiAccess) midiAccess.inputs.forEach(i=>i.onmidimessage=null);
    b.classList.remove('on'); b.textContent='MIDI av'; b.setAttribute('aria-pressed','false');
    return;
  }
  if(!navigator.requestMIDIAccess){ b.textContent='MIDI stöds ej här'; return; }
  try{
    b.textContent='väntar på tillstånd…';
    await initAudio();
    if(AC.state==='suspended') await AC.resume();
    midiAccess = await navigator.requestMIDIAccess();
    midiAccess.onstatechange = ()=>{ if(midiOn) attachMIDI(); };
    midiOn=true; attachMIDI();
    b.classList.add('on'); b.setAttribute('aria-pressed','true');
  }catch(e){ b.textContent='MIDI nekad'; }
}
document.getElementById('midi').addEventListener('click', midiToggle);

function drawPlayed(t,pps){
  if(!midiOn) return;
  for(const pn of played){
    const end = pn.t1===null ? t : pn.t1;
    const x0=HIT+(pn.t0-t)*pps, x1=HIT+(end-t)*pps;
    if(x1<KEYW||x0>W) continue;
    const pos=posOfInt(pn.m); if(pos===null) continue;
    const y0=H-(pos+0.42)*WH, h=WH*0.84;
    const bx0=Math.max(x0,KEYW), bx1=Math.max(Math.min(x1,W),bx0+2);
    ctx.fillStyle=P.midi; ctx.globalAlpha=0.85;
    rr(bx0,y0,bx1-bx0,h,3); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle=P.midiEdge; ctx.lineWidth=1; ctx.stroke();
  }
}

async function micToggle(){
  const b=document.getElementById('mic');
  if(micOn){
    micOn=false; hist.length=0;
    if(micStream) micStream.getTracks().forEach(x=>x.stop());
    micStream=null; analyser=null;
    b.classList.remove('on'); b.textContent='Mikrofon av'; b.setAttribute('aria-pressed','false');
    tNote.textContent='–'; tCents.textContent='sjung med'; tunerEl.className='tuner';
    return;
  }
  if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
    tCents.textContent='mikrofon kräver https'; return;
  }
  try{
    b.textContent='väntar på tillstånd…';
    await initAudio();
    if(AC.state==='suspended') await AC.resume();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    const srcNode=AC.createMediaStreamSource(micStream);
    analyser=AC.createAnalyser(); analyser.fftSize=BUF_SIZE;
    mbuf=new Float32Array(analyser.fftSize);
    srcNode.connect(analyser);                    // ingen koppling till destination = ingen rundgång
    micOn=true;
    b.classList.add('on'); b.textContent='Mikrofon på'; b.setAttribute('aria-pressed','true');
    tCents.textContent='sjung med';
  }catch(e){
    b.textContent='Mikrofon av'; tCents.textContent='åtkomst nekad';
  }
}
document.getElementById('mic').addEventListener('click', micToggle);

/* ---------- text ---------- */
const l0=document.getElementById('l0'), l1=document.getElementById('l1'),
      vlab=document.getElementById('vlabel');
let shown=-2;
function lyrics(t){
  let idx=-1;
  for(let i=0;i<D.syl.length;i++){ if(D.syl[i].t<=t) idx=i; else break; }
  const line = idx<0?0:D.syl[idx].line;
  const nv = D.syl.length ? D.syl[D.syl.length-1].v : 1;
  vlab.textContent = (nv>1 && idx>=0) ? 'Vers '+D.syl[idx].v+' av '+nv : '';
  if(line!==shown){
    shown=line;
    const render=(el,ln)=>{ el.innerHTML='';
      if(ln>=D.nLines) return;
      D.syl.filter(s=>s.line===ln).forEach(s=>{
        const sp=document.createElement('span'); sp.className='syl';
        sp.dataset.t=s.t; sp.textContent=s.x; el.appendChild(sp); }); };
    render(l0,line); render(l1,line+1);
  }
  l0.querySelectorAll('.syl').forEach(sp=>{
    const st=parseFloat(sp.dataset.t);
    sp.classList.toggle('sung', t>=st);
    sp.classList.toggle('now', idx>=0 && D.syl[idx].t===st && t>=st);
  });
}

/* ---------- loop och reglage ---------- */
const fmt=s=>Math.floor(Math.max(s,0)/60)+':'+String(Math.floor(Math.max(s,0)%60)).padStart(2,'0');
const seek=document.getElementById('seek'), nowEl=document.getElementById('now');
let scrubbing=false;
function frame(){
  const t=pieceTime();
  if(playing) frozen=t;
  readVoice(t);
  draw(t); lyrics(t);
  if(!scrubbing){ seek.value=Math.max(0,Math.min(1,t/D.end))*1000; nowEl.textContent=fmt(t); }
  requestAnimationFrame(frame);
}
document.getElementById('play').addEventListener('click',toggle);
seek.addEventListener('input',()=>{ scrubbing=true; nowEl.textContent=fmt(D.end*seek.value/1000); });
seek.addEventListener('change',()=>{ scrubbing=false; seekTo(D.end*seek.value/1000); });

function setKeyLabel(){
  const el=document.getElementById('keyname');
  const name=KEYS[((D.keyPc+shift)%12+12)%12]+'-dur';
  const tag = shift===0?'original':(shift>0?'+':'−')+Math.abs(shift)+' halvtoner';
  el.innerHTML=name+'<em>'+tag+'</em>';
  document.getElementById('down').disabled = shift<=-12;
  document.getElementById('up').disabled = shift>=12;
}
function transpose(d){
  const nxt=Math.max(-12,Math.min(12,shift+d));
  if(nxt===shift) return;
  shift=nxt; setKeyLabel(); buildRange();
  if(playing){ const pt=pieceTime(); allOff(); locate(pt); }
}
document.getElementById('down').addEventListener('click',()=>transpose(-1));
document.getElementById('up').addEventListener('click',()=>transpose(1));
document.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const pt=pieceTime(); rate=parseFloat(b.dataset.r);
  if(playing){ allOff(); t0=AC.currentTime-pt/rate; locate(pt); } else { paused=pt; }
}));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); toggle(); }
  if(e.code==='ArrowUp'){ e.preventDefault(); transpose(1); }
  if(e.code==='ArrowDown'){ e.preventDefault(); transpose(-1); }
});

/* ---------- läsa in egen MIDI-fil ---------- */
function decodeText(bytes){
  try{ return new TextDecoder('utf-8',{fatal:true}).decode(bytes); }
  catch(e){ return new TextDecoder('windows-1252').decode(bytes); }
}
function parseSMF(buf){
  const dv=new DataView(buf); let p=0;
  const tag=()=>{ let s=''; for(let i=0;i<4;i++) s+=String.fromCharCode(dv.getUint8(p++)); return s; };
  const vlq=()=>{ let v=0,b; do{ b=dv.getUint8(p++); v=(v<<7)|(b&0x7F); }while(b&0x80); return v; };
  if(tag()!=='MThd') throw new Error('Filen är inte en MIDI-fil');
  const hlen=dv.getUint32(p); p+=4;
  p+=2;                                     // format
  const ntrk=dv.getUint16(p); p+=2;
  const div=dv.getUint16(p); p+=2;
  if(div & 0x8000) throw new Error('SMPTE-tidkod stöds inte');
  p += hlen-6;
  const tracks=[];
  for(let i=0;i<ntrk && p<buf.byteLength; i++){
    if(tag()!=='MTrk'){ break; }
    const len=dv.getUint32(p); p+=4;
    const end=p+len; let tick=0, running=0; const ev=[];
    while(p<end){
      tick+=vlq();
      let st=dv.getUint8(p);
      if(st & 0x80){ p++; running=st; } else st=running;
      if(st===0xFF){
        const type=dv.getUint8(p++), l=vlq();
        ev.push({tick, meta:type, bytes:new Uint8Array(buf.slice(p,p+l))}); p+=l;
      } else if(st===0xF0||st===0xF7){ const l=vlq(); p+=l; }
      else {
        const cmd=st & 0xF0, d1=dv.getUint8(p++);
        const d2=(cmd===0xC0||cmd===0xD0)?0:dv.getUint8(p++);
        ev.push({tick, cmd, d1, d2});
      }
    }
    p=end; tracks.push(ev);
  }
  return {div, tracks};
}

function midiToSong(buf, filename){
  const {div, tracks}=parseSMF(buf);
  // tempokarta
  const tempos=[];
  tracks.forEach(tr=>tr.forEach(e=>{ if(e.meta===0x51 && e.bytes.length===3)
    tempos.push({tick:e.tick, us:(e.bytes[0]<<16)|(e.bytes[1]<<8)|e.bytes[2]}); }));
  tempos.sort((a,b)=>a.tick-b.tick);
  if(!tempos.length || tempos[0].tick>0) tempos.unshift({tick:0, us:500000});
  const marks=[{tick:0, sec:0, us:tempos[0].us}];
  for(let i=1;i<tempos.length;i++){
    const prev=marks[marks.length-1];
    marks.push({tick:tempos[i].tick,
                sec:prev.sec+(tempos[i].tick-prev.tick)/div*(prev.us/1e6),
                us:tempos[i].us});
  }
  const toSec=tk=>{ let m=marks[0];
    for(const x of marks) if(x.tick<=tk) m=x; else break;
    return m.sec+(tk-m.tick)/div*(m.us/1e6); };

  // noter per spår
  const perTrack=tracks.map(tr=>{
    const open=new Map(), out=[];
    for(const e of tr){
      if(e.cmd===0x90 && e.d2>0){ (open.get(e.d1)||open.set(e.d1,[]).get(e.d1)).push(e.tick); }
      else if(e.cmd===0x80 || (e.cmd===0x90 && e.d2===0)){
        const st=open.get(e.d1); if(st && st.length){ const t0=st.shift();
          out.push({tick:t0, m:e.d1, t:toSec(t0), d:Math.max(toSec(e.tick)-toSec(t0),0.05)}); }
      }
    }
    return out.sort((a,b)=>a.tick-b.tick || a.m-b.m);
  });
  // melodispår: det med flest lyric-events, annars högst medeltonhöjd
  const lyrCount=tracks.map(tr=>tr.filter(e=>e.meta===0x05).length);
  let mi=lyrCount.indexOf(Math.max(...lyrCount));
  if(lyrCount[mi]===0){
    let best=-1; mi=0;
    perTrack.forEach((ns,i)=>{ if(!ns.length) return;
      const avg=ns.reduce((a,n)=>a+n.m,0)/ns.length; if(avg>best){ best=avg; mi=i; } });
  }
  if(!perTrack[mi] || !perTrack[mi].length) throw new Error('Hittade inga toner i filen');

  // stavelser mot melodinoter
  const lyr=[];
  tracks[mi].forEach(e=>{ if(e.meta===0x05||e.meta===0x01&&lyrCount[mi]===0)
    lyr.push({tick:e.tick, x:decodeText(e.bytes)}); });
  lyr.sort((a,b)=>a.tick-b.tick);
  const tol=div/4;
  const notes=[], syl=[]; let lines=0, li=0, lineStart=true;
  perTrack[mi].forEach(n=>{
    let idx=-1;
    while(li<lyr.length && lyr[li].tick < n.tick-tol) li++;
    if(li<lyr.length && lyr[li].tick <= n.tick+tol){
      let text=lyr[li].x; li++;
      const br=/^[\r\n\/\\]+/.exec(text);
      if(br){ text=text.slice(br[0].length); if(syl.length) lines++; }
      if(text.trim()!==''){ idx=syl.length; syl.push({t:+n.t.toFixed(4), x:text, line:lines, v:1}); }
    }
    notes.push({t:+n.t.toFixed(4), d:+n.d.toFixed(4), m:n.m, h:0, s:idx});
  });
  perTrack.forEach((ns,i)=>{ if(i===mi) return;
    ns.forEach(n=>notes.push({t:+n.t.toFixed(4), d:+n.d.toFixed(4), m:n.m, h:1, s:-1})); });
  notes.sort((a,b)=>a.t-b.t);

  // titel och tonart
  let title='';
  tracks.forEach(tr=>tr.forEach(e=>{ if(e.meta===0x03 && !title) title=decodeText(e.bytes).trim(); }));
  if(!title) title=filename.replace(/\.(midi?|kar)$/i,'');
  let keyPc=null;
  tracks.forEach(tr=>tr.forEach(e=>{ if(e.meta===0x59 && e.bytes.length===2 && e.bytes[1]===0){
    const sf=(e.bytes[0]<<24>>24); keyPc=((sf*7)%12+12)%12; } }));
  if(keyPc===null){                       // ingen tonartsangivelse: gissa på slutackordets baston
    const last=Math.max(...notes.map(n=>n.t));
    const fin=notes.filter(n=>n.t>last-0.05).map(n=>n.m);
    keyPc=fin.length?((Math.min(...fin)%12)+12)%12:0;
  }
  const end=Math.max(...notes.map(n=>n.t+n.d));
  return {id:'egen'+Date.now(), nr:950, nrLabel:'egen', title, keyPc, bpm:0,
          credit:'Inläst ur <b>'+filename+'</b>', source:'din egen MIDI-fil',
          notes, syl, nLines:lines+1, end:+end.toFixed(3), verses:[]};
}

const loadMsg=document.getElementById('loadmsg');
document.getElementById('midifile').addEventListener('change', async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  loadMsg.className=''; loadMsg.textContent='läser…';
  try{
    const song=midiToSong(await f.arrayBuffer(), f.name);
    SONGS.push(song); buildShelf();
    load(SONGS.length-1);
    loadMsg.textContent=song.notes.length+' toner, '+song.syl.length+' stavelser';
  }catch(e){
    loadMsg.className='err'; loadMsg.textContent=e.message||'kunde inte läsa filen';
  }
  ev.target.value='';
});

/* ---------- psalmhylla ---------- */
const sel=document.getElementById('song');
function buildShelf(){
  sel.innerHTML='';
  SONGS.forEach((s,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=(s.nrLabel||s.nr)+'  ·  '+s.title;
    sel.appendChild(o);
  });
}
buildShelf();
sel.addEventListener('change',()=>load(+sel.value));
function load(i){
  if(playing){ frozen=pieceTime(); stop(false); }
  D=SONGS[i]; shift=0; paused=-LOOK; frozen=-LOOK; shown=-2; hist.length=0;
  sel.value=i;
  document.getElementById('title').textContent=D.title;
  document.getElementById('credit').innerHTML=D.credit;
  document.getElementById('tot').textContent=fmt(D.end);
  document.getElementById('src').textContent='Melodi transkriberad ur '+D.source+'.';
  const v=document.getElementById('verses'); v.innerHTML='';
  D.verses.forEach(x=>{
    const d=document.createElement('div');
    d.innerHTML='<h2>'+x.h+'</h2><p>'+x.lines.join('<br>')+'</p>';
    v.appendChild(d);
  });
  setKeyLabel(); buildRange();
}
setTheme(window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
document.getElementById('theme').addEventListener('click',
  ()=> setTheme(P===PAL.dark ? 'light' : 'dark'));
load(0); requestAnimationFrame(frame);
</script>
